services:
  bot:
    build: .
    container_name: fakbishbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
